[project]
name = "aibom-verifier"
version = "0.1.0"
description = "Passive, weight-level verification of LLM base_model provenance claims"
readme = "README.md"
authors = [
    { name = "Ali Al-Sorehi", email = "aalsoreh@redhat.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.26.0",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
