name: Feature request
description: A new capability to add to aibom-security
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Board habits** (see `AGENTS.md`): keep shared context on this issue.
        Comments use prefixes `Plan:` · `Context:` · `Decision:` · `Stuck:` · `Done:`.
        **What I Got Stuck On** is for durable blockers only.
        Status labels: (none = ready) → `in-progress` → `blocked` → close when done.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should this do, and why does it matter for the verifier/AI-BOM work?
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does NOT cover (helps keep PRs small and reviewable)
    validations:
      required: false

  - type: textarea
    id: happy-path-test
    attributes:
      label: Happy Path Test
      description: >
        Every feature ships with a test proving the main success case works.
        Describe it here — the PR closing this issue must include it.
      placeholder: "e.g. verifying SmolTulu-1.7b-Instruct against SmolLM2-1.7B returns verdict=verified_derivative"
    validations:
      required: true

  - type: dropdown
    id: estimate
    attributes:
      label: Estimated Time
      description: Rough estimate, set when you pick this up
      options:
        - "< 1 day"
        - "1-3 days"
        - "3-5 days"
        - "1-2 weeks"
        - "2+ weeks"
    validations:
      required: true

  - type: textarea
    id: stuck-on
    attributes:
      label: What I Got Stuck On
      description: >
        Leave empty at creation. Update only for durable blockers (what
        blocks you and what would unblock it). Day-to-day progress goes in
        comments as Plan: / Decision: / Done: — see AGENTS.md.
      placeholder: "(nothing yet)"
    validations:
      required: false
