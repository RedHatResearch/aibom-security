name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      # Model-download/network integration tests are excluded from CI on purpose —
      # they hit the Hugging Face Hub and shouldn't gate every push. Run them
      # locally with `uv run pytest -m network`.
      - name: Test (pytest, offline only)
        run: uv run pytest -m "not network" -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t aibom-security:ci .

      - name: CLI boots in image
        run: |
          docker run --rm aibom-security:ci --help
          docker run --rm aibom-security:ci verify --help

      # Same offline boundary as lint-and-test: a valid model POST would
      # spawn a verify subprocess that hits the Hugging Face Hub. Boot the
      # serve entrypoint and exercise the paths that stay offline.
      - name: Serve boots in image (health, auth, validation)
        run: |
          mkdir -p /tmp/aibom-runs
          sudo chown 999:999 /tmp/aibom-runs
          docker run -d --name aibom-serve \
            -p 127.0.0.1:8080:8080 \
            -e AIBOM_API_TOKEN=ci-smoke \
            -e AIBOM_RUNS_DIR=/runs \
            -v /tmp/aibom-runs:/runs \
            --entrypoint aibom-serve \
            aibom-security:ci --host 0.0.0.0 --port 8080
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz > /dev/null
          docker exec aibom-serve test -w /runs
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -X POST http://127.0.0.1:8080/verify \
            -H 'content-type: application/json' \
            -d '{"model_id": "org/model"}')" = 401
          test "$(code -X POST http://127.0.0.1:8080/verify \
            -H 'authorization: Bearer wrong-token' \
            -H 'content-type: application/json' \
            -d '{"model_id": "org/model"}')" = 401
          test "$(code -X POST http://127.0.0.1:8080/verify \
            -H 'authorization: Bearer ci-smoke' \
            -H 'content-type: application/json' \
            -d '{"model_id": "not a repo id"}')" = 422
          docker rm -f aibom-serve > /dev/null
