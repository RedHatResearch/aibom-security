[project]
name = "provenancebench"
version = "0.1.0"
description = "Fixed labeled model pairs for weight-level lineage verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.0",
    "ml-dtypes>=0.5",
    "gguf>=0.10",
    "huggingface_hub>=0.34",
]

[project.scripts]
pbench-eval = "pbench.eval:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pbench"
module-root = "src"
